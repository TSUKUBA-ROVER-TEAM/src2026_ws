launch:
  - arg:
      name: robstride_only
      default: 'false'
      description: Use real RobStride motors and mock all ITR joints without sending ITR CAN FD traffic
  - arg:
      name: can_interface
      default: can0
      description: SocketCAN interface used by itr_can_hardware
  - arg:
      name: drive_gear_ratio
      default: '19.0'
      description: Robomas motor rotations per wheel rotation
  - arg:
      name: robomas_board_id
      default: '3'
      description: CAN board ID for the four Robomas drive modules
  - arg:
      name: arm_y_module_id
      default: '6'
      description: Robomas module ID for arm_y_joint (6 is U5 ESC ID 2)
  - arg:
      name: servo_board_id
      default: '1'
      description: CAN board ID for the four steering servo modules

  - node:
      pkg: controller_manager
      exec: ros2_control_node
      name: controller_manager
      output: screen
      param:
        - name: robot_description
          value: $(command 'xacro $(find-pkg-share src2026_description)/urdf/src2026.xacro use_real_hardware:=true robstride_only:=$(var robstride_only) can_interface:=$(var can_interface) drive_gear_ratio:=$(var drive_gear_ratio) robomas_board_id:=$(var robomas_board_id) arm_y_module_id:=$(var arm_y_module_id) servo_board_id:=$(var servo_board_id)')
        - from: $(find-pkg-share src2026_bringup)/config/real_controllers.yaml

  - node:
      pkg: robot_state_publisher
      exec: robot_state_publisher
      name: robot_state_publisher
      output: screen
      param:
        - name: robot_description
          value: $(command 'xacro $(find-pkg-share src2026_description)/urdf/src2026.xacro use_real_hardware:=true robstride_only:=$(var robstride_only) can_interface:=$(var can_interface) drive_gear_ratio:=$(var drive_gear_ratio) robomas_board_id:=$(var robomas_board_id) arm_y_module_id:=$(var arm_y_module_id) servo_board_id:=$(var servo_board_id)')

  - node:
      pkg: controller_manager
      exec: spawner
      name: joint_state_broadcaster_spawner
      output: screen
      args: joint_state_broadcaster -c /controller_manager

  - include:
      file: $(find-pkg-share ros2_socketcan)/launch/socket_can_bridge.launch.xml
      arg:
        - name: interface
          value: $(var can_interface)
        - name: receiver_interval_sec
          value: '0.05'

  - node:
      pkg: controller_manager
      exec: hardware_spawner
      name: robstride_hardware_spawner
      output: screen
      args: RobStrideSystem --controller-manager /controller_manager --activate

  - node:
      pkg: controller_manager
      exec: spawner
      name: arm_position_controller_spawner
      output: screen
      args: arm_position_controller -c /controller_manager --inactive

  - node:
      pkg: controller_manager
      exec: spawner
      name: itr_swerve_controller_spawner
      output: screen
      args: itr_swerve_controller -c /controller_manager

  - node:
      pkg: controller_manager
      exec: spawner
      name: arm_velocity_controller_spawner
      output: screen
      args: arm_velocity_controller -c /controller_manager

  - include:
      file: $(find-pkg-share src2026_manual)/launch/teleop.launch.yaml

  - node:
      pkg: src2026_control
      exec: recovery_manager.py
      name: robstride_recovery_manager
      output: screen
